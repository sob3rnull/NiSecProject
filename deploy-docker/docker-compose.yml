# Wazuh single-node stack in Docker.
# ALTERNATIVE deployment path — see deploy-docker/README.md.
# The default/primary path is the all-in-one installer (provision/wazuh-server.sh),
# which is more forgiving on small hosts. This compose file exists because the
# project proposal states the Ubuntu Server "runs Docker containers for easier
# deployment" — so you can demonstrate and defend the containerised deployment.
#
# Upstream reference: https://github.com/wazuh/wazuh-docker (single-node)

services:
  wazuh.manager:
    image: wazuh/wazuh-manager:4.14.0
    container_name: wazuh.manager
    restart: always
    ulimits:
      memlock: { soft: -1, hard: -1 }
      nofile:  { soft: 655360, hard: 655360 }
    ports:
      - "1514:1514"      # agent data
      - "1515:1515"      # agent enrolment
      - "514:514/udp"    # syslog
      - "55000:55000"    # Wazuh API
    environment:
      - INDEXER_URL=https://wazuh.indexer:9200
      - INDEXER_USERNAME=admin
      - INDEXER_PASSWORD=${INDEXER_PASSWORD:?INDEXER_PASSWORD must be set in .env}
      - FILEBEAT_SSL_VERIFICATION_MODE=none
    volumes:
      - wazuh_api_config:/var/ossec/api/configuration
      - wazuh_etc:/var/ossec/etc
      - wazuh_logs:/var/ossec/logs
      - wazuh_queue:/var/ossec/queue
      - wazuh_var_multigroups:/var/ossec/var/multigroups
      - wazuh_integrations:/var/ossec/integrations
      - wazuh_active_response:/var/ossec/active-response/bin
      - wazuh_agentless:/var/ossec/agentless
      - wazuh_wodles:/var/ossec/wodles
      # our custom rules/decoders, mounted read-only
      - ../config/wazuh-manager/local_rules.xml:/var/ossec/etc/rules/local_rules.xml:ro
      - ../config/wazuh-manager/local_decoder.xml:/var/ossec/etc/decoders/local_decoder.xml:ro
      # TLS material from the upstream cert generator (see up.sh). Without
      # these mounts the certificates exist on disk but never reach the
      # container, and filebeat fails its handshake to the indexer.
      - ./config/wazuh_indexer_ssl_certs/root-ca-manager.pem:/etc/ssl/root-ca.pem
      - ./config/wazuh_indexer_ssl_certs/wazuh.manager.pem:/etc/ssl/filebeat.pem
      - ./config/wazuh_indexer_ssl_certs/wazuh.manager-key.pem:/etc/ssl/filebeat.key

  wazuh.indexer:
    image: wazuh/wazuh-indexer:4.14.0
    container_name: wazuh.indexer
    restart: always
    ports:
      # Bound to loopback ON PURPOSE. Docker publishes ports through its own
      # iptables chain, which ufw does not filter — so the `ufw deny 9200/tcp`
      # rule in scripts/harden-dashboard.sh would NOT protect a "9200:9200"
      # mapping, and the indexer would sit exposed to the whole lab network.
      - "127.0.0.1:9200:9200"
    environment:
      - OPENSEARCH_JAVA_OPTS=-Xms1g -Xmx1g   # keep small for lab hosts
      - bootstrap.memory_lock=true
    ulimits:
      memlock: { soft: -1, hard: -1 }
      nofile:  { soft: 65536, hard: 65536 }
    volumes:
      - wazuh_indexer_data:/var/lib/wazuh-indexer
      # TLS + security config from the upstream generator (see up.sh).
      # internal_users.yml is what actually sets the indexer admin password.
      - ./config/wazuh_indexer_ssl_certs/root-ca.pem:/usr/share/wazuh-indexer/certs/root-ca.pem
      - ./config/wazuh_indexer_ssl_certs/wazuh.indexer-key.pem:/usr/share/wazuh-indexer/certs/wazuh.indexer.key
      - ./config/wazuh_indexer_ssl_certs/wazuh.indexer.pem:/usr/share/wazuh-indexer/certs/wazuh.indexer.pem
      - ./config/wazuh_indexer_ssl_certs/admin.pem:/usr/share/wazuh-indexer/certs/admin.pem
      - ./config/wazuh_indexer_ssl_certs/admin-key.pem:/usr/share/wazuh-indexer/certs/admin-key.pem
      - ./config/wazuh_indexer/wazuh.indexer.yml:/usr/share/wazuh-indexer/opensearch.yml
      - ./config/wazuh_indexer/internal_users.yml:/usr/share/wazuh-indexer/opensearch-security/internal_users.yml

  wazuh.dashboard:
    image: wazuh/wazuh-dashboard:4.14.0
    container_name: wazuh.dashboard
    restart: always
    ports:
      - "443:5601"
    environment:
      - INDEXER_USERNAME=admin
      - INDEXER_PASSWORD=${INDEXER_PASSWORD:?INDEXER_PASSWORD must be set in .env}
      - WAZUH_API_URL=https://wazuh.manager
      - API_USERNAME=wazuh-wui
      - API_PASSWORD=${API_PASSWORD:?API_PASSWORD must be set in .env}
    volumes:
      - ./config/wazuh_indexer_ssl_certs/wazuh.dashboard.pem:/usr/share/wazuh-dashboard/certs/wazuh-dashboard.pem
      - ./config/wazuh_indexer_ssl_certs/wazuh.dashboard-key.pem:/usr/share/wazuh-dashboard/certs/wazuh-dashboard-key.pem
      - ./config/wazuh_indexer_ssl_certs/root-ca.pem:/usr/share/wazuh-dashboard/certs/root-ca.pem
      - ./config/wazuh_dashboard/opensearch_dashboards.yml:/usr/share/wazuh-dashboard/config/opensearch_dashboards.yml
      - ./config/wazuh_dashboard/wazuh.yml:/usr/share/wazuh-dashboard/config/wazuh.yml
    depends_on:
      - wazuh.indexer
    links:
      - wazuh.indexer:wazuh.indexer
      - wazuh.manager:wazuh.manager

volumes:
  wazuh_api_config:
  wazuh_etc:
  wazuh_logs:
  wazuh_queue:
  wazuh_var_multigroups:
  wazuh_integrations:
  wazuh_active_response:
  wazuh_agentless:
  wazuh_wodles:
  wazuh_indexer_data:
